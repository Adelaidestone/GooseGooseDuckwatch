version: "3.8"
services:
  app:
    build: .
    ports:
      - "8000:8000"
    volumes:
      - ./:/app:Z
      - ./data:/app/data:Z
    environment:
      - DATA_TTL_HOURS=24
      - SCRAPER_CONCURRENCY=0
      - SCRAPER_RETRY_AFTER=5
      - CHROME_BIN=/usr/bin/chromium
      - ARCHIVE_SEARCHMATCHES=false
    shm_size: "1g"
    ulimits:
      core:
        soft: 0
        hard: 0
    restart: unless-stopped
