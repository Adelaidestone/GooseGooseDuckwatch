<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>木泗鹅鸭杀查询器</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --main: #46a6f8;
      --bgcolor: #100a21;
      --bgcolor-card: #1e1535;
      --text: #ffffff;
      --text-secondary: #b3b3b3;
      --text-muted: #707070;
      --gradient-primary: linear-gradient(90deg, #00a6ff 0%, #c369ff 52.4%, #ff4590 100%);
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Inter', 'Microsoft YaHei', sans-serif;
      background: radial-gradient(1200px 600px at 10% 10%, rgba(70,166,248,0.15), transparent 60%),
                  radial-gradient(1000px 500px at 90% 20%, rgba(255,69,144,0.12), transparent 60%),
                  radial-gradient(900px 600px at 20% 90%, rgba(195,105,255,0.12), transparent 60%),
                  var(--bgcolor);
      color: var(--text);
      min-height: 100vh;
      padding: 40px 20px;
      overflow-x: hidden;
    }
    .container { max-width: 1200px; margin: 0 auto; }
    h1 {
      font-size: 28px;
      margin-bottom: 10px;
      background: var(--gradient-primary);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }
    .subtitle { color: var(--text-secondary); margin-bottom: 20px; }
    .card {
      background: rgba(30,21,53,0.6);
      padding: 24px;
      border-radius: 16px;
      margin-bottom: 24px;
      border: 1px solid rgba(255,255,255,0.08);
      box-shadow: 0 10px 40px rgba(0,0,0,0.35), 0 0 0 1px rgba(255,255,255,0.03) inset;
      backdrop-filter: blur(8px);
    }
    .form-row { display: flex; flex-direction: column; gap: 14px; }
    .form-row label { color: var(--text-secondary); font-size: 14px; }
    .form-row input {
      width: 100%;
      padding: 12px 14px;
      border-radius: 10px;
      border: 1px solid rgba(255,255,255,0.08);
      outline: none;
      background: rgba(255,255,255,0.03);
      color: var(--text);
      transition: box-shadow .2s ease, border-color .2s ease;
    }
    .form-row input:focus { box-shadow: 0 0 0 3px rgba(70,166,248,0.25); border-color: rgba(70,166,248,0.55); }
    .form-row button {
      padding: 12px 18px;
      border: none;
      border-radius: 10px;
      background: linear-gradient(90deg, #00a6ff 0%, #c369ff 52%, #ff4590 100%);
      color: white; font-weight: 700; letter-spacing: .5px; cursor: pointer;
      box-shadow: 0 10px 20px rgba(0,166,255,0.25), 0 8px 24px rgba(255,69,144,0.18);
      transition: transform .12s ease, box-shadow .2s ease;
    }
    .form-row button:hover { transform: translateY(-1px); box-shadow: 0 14px 26px rgba(0,166,255,0.32), 0 10px 28px rgba(255,69,144,0.22); }
    .stats { display: flex; gap: 20px; margin: 20px 0; flex-wrap: wrap; }
    .stat-item { background: var(--bgcolor-card); padding: 20px 30px; border-radius: 12px; text-align: center; min-width: 120px; }
    .stat-value { font-size: 32px; font-weight: 700; color: var(--main); }
    .stat-label { font-size: 14px; color: var(--text-muted); margin-top: 5px; }

    table.records-table { width: 100%; border-collapse: collapse; background: var(--bgcolor-card); border-radius: 12px; overflow: hidden; }
    .records-table th { background: rgba(70, 166, 248, 0.2); color: var(--main); padding: 15px; text-align: left; font-weight: 600; font-size: 14px; }
    .records-table td { padding: 12px 15px; border-bottom: 1px solid rgba(255,255,255,0.05); font-size: 14px; }
    .records-table tr:hover { background: rgba(70, 166, 248, 0.1); }
    .records-table tr:last-child td { border-bottom: none; }

    .win-tag { background: #10b981; color: white; padding: 4px 12px; border-radius: 12px; font-size: 12px; font-weight: 600; }
    .loss-tag { background: #ef4444; color: white; padding: 4px 12px; border-radius: 12px; font-size: 12px; font-weight: 600; }

    .hidden { display: none; }
  </style>
</head>
<body>
  <div class="container">
    <h1>🦆 木泗鹅鸭杀查询器</h1>
    <p class="subtitle">邮箱登录 · 输入用户名与密码后获取记录</p>

    <div class="card">
      <div class="form-row">
        <label for="email">用户名</label>
        <input id="email" type="email" placeholder="用户名或邮箱" />
        <label for="password">密码</label>
        <input id="password" type="password" placeholder="密码" />
        <button id="fetchBtn">登录并获取</button>
      </div>
      <p id="msg" class="subtitle"></p>
    </div>

    <div class="stats hidden" id="stats">
      <div class="stat-item"><div class="stat-value" id="total">0</div><div class="stat-label">总记录</div></div>
      <div class="stat-item"><div class="stat-value" id="wins">0</div><div class="stat-label">胜利</div></div>
      <div class="stat-item"><div class="stat-value" id="losses">0</div><div class="stat-label">失败</div></div>
      <div class="stat-item"><div class="stat-value" id="win_rate">0%</div><div class="stat-label">胜率</div></div>
    </div>

    <table class="records-table hidden" id="table">
      <thead><tr id="thead"><th>#</th></tr></thead>
      <tbody id="tbody"></tbody>
    </table>
  </div>

  <script>
    const $ = (sel) => document.querySelector(sel)
    const fetchBtn = $('#fetchBtn')
    const emailEl = $('#email')
    const pwdEl = $('#password')
    const msg = $('#msg')
    const stats = $('#stats')
    const totalEl = $('#total')
    const winsEl = $('#wins')
    const lossesEl = $('#losses')
    const rateEl = $('#win_rate')
    const thead = $('#thead')
    const tbody = $('#tbody')
    const table = $('#table')

    function esc(s){ return String(s).replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;') }

    function render(data){
      const { headers, rows, summary } = data
      // stats
      stats.classList.remove('hidden')
      totalEl.textContent = summary.total
      winsEl.textContent = summary.wins
      lossesEl.textContent = summary.losses
      rateEl.textContent = summary.win_rate + '%'

      // header
      thead.innerHTML = '<th>#</th>' + headers.map(h => `<th>${esc(h)}</th>`).join('')

      // rows
      tbody.innerHTML = rows.map((row, idx) => {
        const cells = row.map(ctext => {
          if ((ctext.includes('胜利')) || (ctext.includes('获胜')) || (ctext.includes('勝'))){
            return '<td><span class="win-tag">胜利</span></td>'
          } else if ((ctext.includes('失败')) || (ctext.includes('敗'))){
            return '<td><span class="loss-tag">失败</span></td>'
          }
          return `<td>${esc(ctext)}</td>`
        }).join('')
        return `<tr><td>${idx+1}</td>${cells}</tr>`
      }).join('')

      table.classList.remove('hidden')
    }

    fetchBtn.addEventListener('click', async () => {
      const email = emailEl.value.trim()
      const password = pwdEl.value.trim()
      if(!email || !password){ msg.textContent = '请输入邮箱和密码'; return }
      msg.textContent = '正在获取，请稍候...'
      try{
        const resp = await fetch('../api/fetch', {
          method: 'POST', headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email, password })
        })
        if(!resp.ok){
          const t = await resp.text()
          throw new Error(t || ('HTTP ' + resp.status))
        }
        const data = await resp.json()
        render(data)
        msg.textContent = '已更新'
      }catch(err){
        console.error(err)
        msg.textContent = '获取失败：' + err.message
      }
    })
  </script>
</body>
</html>
