<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>木泗鹅鸭杀查询器 · 对局记录</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --main: #46a6f8;
      --bgcolor: #100a21;
      --bgcolor-card: #1e1535;
      --text: #ffffff;
      --text-secondary: #b3b3b3;
      --text-muted: #707070;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Inter', 'Microsoft YaHei', sans-serif;
      background: radial-gradient(1200px 600px at 10% 10%, rgba(70,166,248,0.15), transparent 60%),
                  radial-gradient(1000px 500px at 90% 20%, rgba(255,69,144,0.12), transparent 60%),
                  radial-gradient(900px 600px at 20% 90%, rgba(195,105,255,0.12), transparent 60%),
                  var(--bgcolor);
      color: var(--text);
      min-height: 100vh;
      padding: 40px 20px;
    }
    .container { max-width: 1200px; margin: 0 auto; }
    .header { display:flex; align-items:center; justify-content:space-between; margin-bottom: 18px; }
    .title { font-size: 24px; background: linear-gradient(90deg, #00a6ff 0%, #c369ff 52%, #ff4590 100%); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; }
    .stats { display: flex; gap: 20px; margin: 20px 0; flex-wrap: wrap; }
    .stat-item { background: var(--bgcolor-card); padding: 20px 30px; border-radius: 12px; text-align: center; min-width: 120px; }
    .stat-value { font-size: 32px; font-weight: 700; color: var(--main); }
    .stat-label { font-size: 14px; color: var(--text-muted); margin-top: 5px; }

    table.records-table { width: 100%; border-collapse: collapse; background: var(--bgcolor-card); border-radius: 12px; overflow: hidden; }
    .records-table th { background: rgba(70, 166, 248, 0.2); color: var(--main); padding: 15px; text-align: left; font-weight: 600; font-size: 14px; }
    .records-table td { padding: 12px 15px; border-bottom: 1px solid rgba(255,255,255,0.05); font-size: 14px; }
    .records-table tr:hover { background: rgba(70, 166, 248, 0.1); }
    .records-table tr.clickable { cursor: pointer; }
    .records-table tr:last-child td { border-bottom: none; }
    .win-tag { background: #10b981; color: white; padding: 4px 12px; border-radius: 12px; font-size: 12px; font-weight: 600; }
    .loss-tag { background: #ef4444; color: white; padding: 4px 12px; border-radius: 12px; font-size: 12px; font-weight: 600; }
    .hidden { display: none; }
    .role-cell { display: flex; align-items: center; gap: 10px; }
    .avatar { width: 24px; height: 24px; border-radius: 50%; background: linear-gradient(135deg,#00a6ff,#c369ff); display: flex; align-items: center; justify-content: center; color: #fff; font-weight: 700; font-size: 12px; flex: 0 0 24px; overflow: hidden; }
    .avatar img { width: 100%; height: 100%; object-fit: contain; display: block; }
    .role-text { display: flex; flex-direction: column; line-height: 1.2; }
    .role-name { color: #fff; }
    .role-sub { color: var(--text-muted); font-size: 12px; }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <div class="title">🦆 木泗鹅鸭杀查询器 · 对局记录</div>
    </div>

    <div class="stats hidden" id="stats">
      <div class="stat-item"><div class="stat-value" id="total">0</div><div class="stat-label">总记录</div></div>
      <div class="stat-item"><div class="stat-value" id="wins">0</div><div class="stat-label">胜利</div></div>
      <div class="stat-item"><div class="stat-value" id="losses">0</div><div class="stat-label">失败</div></div>
      <div class="stat-item"><div class="stat-value" id="win_rate">0%</div><div class="stat-label">胜率</div></div>
    </div>

    <table class="records-table hidden" id="table">
      <thead><tr id="thead"><th>#</th></tr></thead>
      <tbody id="tbody"></tbody>
    </table>
  </div>

  <script>
    const $ = (sel) => document.querySelector(sel)
    const stats = $('#stats')
    const totalEl = $('#total')
    const winsEl = $('#wins')
    const lossesEl = $('#losses')
    const rateEl = $('#win_rate')
    const thead = $('#thead')
    const tbody = $('#tbody')
    const table = $('#table')

    function esc(s){ return String(s).replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;') }

    function getSession(){
      const u = new URL(window.location.href)
      return u.searchParams.get('session')
    }
    function navigateToDetail(session, index){
      window.location.href = 'detail.html?session=' + encodeURIComponent(session) + '&index=' + encodeURIComponent(index)
    }

    function render(data){
      const { headers, rows, summary } = data
      stats.classList.remove('hidden')
      totalEl.textContent = summary.total
      winsEl.textContent = summary.wins
      lossesEl.textContent = summary.losses
      rateEl.textContent = summary.win_rate + '%'

      thead.innerHTML = '<th>#</th>' + headers.map(h => `<th>${esc(h)}</th>`).join('')
      tbody.innerHTML = rows.map((row, idx) => {
        const extra = (data.extras || [])[idx] || {}
        const cells = row.map((ctext, j) => {
          if (j === 0) {
            const roleName = ctext || '-'
            const logo = extra.roleLogo || ''
            const initial = (roleName || '?').charAt(0)
            const modeText = (extra.mode == null) ? '-' : String(extra.mode)
            const mapText = extra.map || '-'
            const avatar = logo ? `<div class="avatar"><img src="${logo}" alt="${esc(roleName)}" /></div>` : `<div class="avatar">${esc(initial)}</div>`
            const text = `<div class="role-text"><div class="role-name">${esc(roleName)}</div><div class="role-sub">模式：${esc(modeText)} · 地图：${esc(mapText)}</div></div>`
            return `<td><div class="role-cell">${avatar}${text}</div></td>`
          }
          if ((ctext.includes('胜利')) || (ctext.includes('获胜')) || (ctext.includes('勝'))){
            return '<td><span class="win-tag">胜利</span></td>'
          } else if ((ctext.includes('失败')) || (ctext.includes('敗'))){
            return '<td><span class="loss-tag">失败</span></td>'
          }
          return `<td>${esc(ctext)}</td>`
        }).join('')
        return `<tr class="clickable" data-index="${idx}"><td>${idx+1}</td>${cells}</tr>`
      }).join('')

      table.classList.remove('hidden')
    }

    let clickBound = false
    async function fetchAndRender(session){
      const r = await fetch('../api/records?session_id=' + encodeURIComponent(session))
      if(!r.ok){ throw new Error('加载失败: ' + r.status) }
      const data = await r.json()
      if(data.status && data.status !== 'done'){
        setTimeout(() => fetchAndRender(session), 800)
        return
      }
      render(data)
      if(!clickBound){
        tbody.addEventListener('click', (e) => {
          const tr = e.target.closest('tr.clickable')
          if(!tr) return
          const idx = tr.getAttribute('data-index')
          navigateToDetail(session, idx)
        })
        clickBound = true
      }
    }

    function setupSSE(session){
      try{
        const es = new EventSource('../api/sse?session_id=' + encodeURIComponent(session))
        es.addEventListener('records', () => {
          fetchAndRender(session)
        })
      }catch(e){}
    }

    async function load(){
      const session = getSession()
      if(!session){ window.location.href = '../'; return }
      try{
        await fetchAndRender(session)
        setupSSE(session)
      }catch(e){
        alert('加载失败：' + e.message)
      }
    }

    document.addEventListener('DOMContentLoaded', load)
  </script>
</body>
</html>
