<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>木泗鹅鸭杀查询器 · 登录</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/lottie-web/5.12.2/lottie.min.js"></script>
  <style>
    :root {
      --main: #46a6f8;
      --bgcolor: #100a21;
      --bgcolor-card: #1e1535;
      --text: #ffffff;
      --text-secondary: #b3b3b3;
      --text-muted: #707070;
      --gradient-primary: linear-gradient(90deg, #00a6ff 0%, #c369ff 52.4%, #ff4590 100%);
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Inter', 'Microsoft YaHei', sans-serif;
      height: 100vh; width: 100vw;
      display: flex; align-items: center; justify-content: center;
      background: radial-gradient(1200px 600px at 10% 10%, rgba(70,166,248,0.15), transparent 60%),
                  radial-gradient(1000px 500px at 90% 20%, rgba(255,69,144,0.12), transparent 60%),
                  radial-gradient(900px 600px at 20% 90%, rgba(195,105,255,0.12), transparent 60%),
                  var(--bgcolor);
      color: var(--text);
      overflow: hidden;
    }
    .idcard {
      width: 560px; min-height: 360px;
      background: linear-gradient(160deg, rgba(255,255,255,0.10), rgba(255,255,255,0.04) 60%), rgba(30,21,53,0.55);
      padding: 20px 20px 16px 20px;
      border-radius: 20px;
      border: 1px solid rgba(255,255,255,0.12);
      box-shadow: 0 10px 40px rgba(0,0,0,0.35), 0 0 0 1px rgba(255,255,255,0.03) inset;
      backdrop-filter: blur(8px);
      display: flex; flex-direction: column; gap: 10px; justify-content: flex-start;
      position: relative; z-index: 1;
    }
    h1 {
      font-size: 22px;
      text-align: center;
      background: var(--gradient-primary);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      margin-bottom: 4px;
    }
    .title { font-size: 24px; background: var(--gradient-primary); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; text-align: center; }
    .subtitle { color: var(--text-secondary); text-align: center; font-size: 13px; margin-bottom: 6px; }
    label { color: var(--text-secondary); font-size: 14px; }
    input {
      width: 100%;
      padding: 12px 14px;
      border-radius: 10px;
      border: 1px solid rgba(255,255,255,0.08);
      outline: none;
      background: rgba(255,255,255,0.03);
      color: var(--text);
      transition: box-shadow .2s ease, border-color .2s ease;
    }
    input:focus { box-shadow: 0 0 0 3px rgba(70,166,248,0.25); border-color: rgba(70,166,248,0.55); }
    button {
      width: 100%; padding: 12px 18px; border: none; border-radius: 10px;
      background: linear-gradient(90deg, #00a6ff 0%, #c369ff 52%, #ff4590 100%);
      color: white; font-weight: 700; letter-spacing: .5px; cursor: pointer;
      box-shadow: 0 10px 20px rgba(0,166,255,0.25), 0 8px 24px rgba(255,69,144,0.18);
      transition: transform .12s ease, box-shadow .2s ease;
    }
    button:hover { transform: translateY(-1px); box-shadow: 0 14px 26px rgba(0,166,255,0.32), 0 10px 28px rgba(255,69,144,0.22); }
    #msg { text-align: center; color: var(--text-secondary); min-height: 18px; font-size: 13px; }

    /* Parallax layers */
    #parallax { position: fixed; inset: 0; z-index: 0; pointer-events: none; }
    #stars { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
    .floaters { position: absolute; inset: 0; }
    .floater { position: absolute; pointer-events: none; opacity: .6; filter: drop-shadow(0 4px 12px rgba(0,0,0,.35)); }
    .floater.banana { left: 8%; top: 30%; width: 64px; height: 64px; background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='64' height='64' viewBox='0 0 64 64'><path d='M10 40c10 8 26 10 44 6-8 4-18 8-30 6-6-1-12-4-14-8 0-2 0-4 0-4z' fill='%23f2c84b'/><path d='M12 42c4 5 20 8 34 6-8 2-18 4-26 2-5-1-8-3-8-8z' fill='%23e0a81f'/></svg>"); background-size: contain; background-repeat: no-repeat; animation: floatY 10s ease-in-out infinite, rotateSlow 24s linear infinite; }
    .floater.pizza { right: 12%; top: 18%; width: 72px; height: 72px; background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='72' height='72' viewBox='0 0 72 72'><path d='M8 60 L36 8 L64 60 Z' fill='%23f4d38a'/><circle cx='36' cy='40' r='5' fill='%23d8345f'/><circle cx='26' cy='48' r='4' fill='%23d8345f'/><circle cx='46' cy='50' r='4' fill='%23d8345f'/><path d='M12 56 L36 16 L60 56 Z' fill='none' stroke='%23f7b733' stroke-width='6' stroke-linejoin='round'/></svg>"); background-size: contain; background-repeat: no-repeat; animation: floatY 14s ease-in-out infinite reverse, rotateSlow 30s linear infinite reverse; }
    .floater.helmet { left: 70%; top: 70%; width: 80px; height: 80px; background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='80' height='80' viewBox='0 0 80 80'><circle cx='40' cy='40' r='28' fill='%23cdd6f4'/><path d='M16 44h48v8a4 4 0 0 1-4 4H20a4 4 0 0 1-4-4z' fill='%2399a1c7'/><rect x='22' y='30' width='36' height='18' rx='9' fill='%233a3f5c'/></svg>"); background-size: contain; background-repeat: no-repeat; animation: floatY 18s ease-in-out infinite, rotateSlow 40s linear infinite; }
    @keyframes floatY { 0%,100% { transform: translateY(-6px); } 50% { transform: translateY(6px); } }
    @keyframes rotateSlow { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    #cameo { position: absolute; inset: 0; pointer-events: none; overflow: hidden; }
    .cameo-run { position: absolute; bottom: 20%; left: -20%; width: 160px; height: 80px; display: flex; gap: 8px; align-items: center; }
    .cameo-goose, .cameo-duck { width: 72px; height: 72px; background: radial-gradient(circle at 40% 40%, #fff 0%, #f2f2f2 60%, #c9c9c9 100%); border-radius: 50%; box-shadow: 0 6px 20px rgba(0,0,0,.35); }
    .cameo-duck { background: radial-gradient(circle at 40% 40%, #ffd67a 0%, #f3b338 70%, #d88416 100%); }
    .move-across { animation: moveAcross 6s linear forwards; }
    @keyframes moveAcross { 0% { transform: translateX(0); opacity: 0; } 8% { opacity: .95; } 100% { transform: translateX(140vw); opacity: 0; } }

    /* Terminal framing */
    .terminal { width: 420px; background: #333; border: 4px solid #000; border-radius: 16px; padding: 16px; box-shadow: 10px 10px 0 rgba(0,0,0,.2); position: relative; z-index: 1; font-family: 'Microsoft YaHei','PingFang SC','Noto Sans SC','Source Han Sans SC',sans-serif; }
    .screen { background: #1a1d23; border: 3px solid #000; border-radius: 10px; padding: 16px; margin-bottom: 16px; color: #50fa7b; }
    .lcd-hint { margin: 0 0 8px 0; font-size: 12px; opacity: .8; color: #9be3a4; }
    .lcd-input { width: 100%; background: transparent; border: none; border-bottom: 2px solid #444; color: #e8ffe8; padding: 8px 0; margin-bottom: 12px; outline: none; font-family: inherit; }
    .lcd-input:focus { border-bottom-color: #50fa7b; }
    .reader-slot { height: 60px; background: #0e0e0e; border: 3px solid #000; border-radius: 6px; position: relative; margin: 14px 0; overflow: hidden; transition: opacity .2s ease; }
    .reader-slot.locked { opacity: .55; }
    .reader-slot.scanning::after { content: ""; position: absolute; inset: 0; background: linear-gradient(90deg, rgba(255,255,255,0) 0%, rgba(90,200,250,0.18) 45%, rgba(90,200,250,0.35) 50%, rgba(90,200,250,0.18) 55%, rgba(255,255,255,0) 100%); transform: translateX(-100%); animation: slotScan 1.1s linear infinite; pointer-events: none; }
    @keyframes slotScan { 0% { transform: translateX(-100%); } 100% { transform: translateX(100%); } }
    .slot-guide { position: absolute; left: 12px; right: 36px; top: 50%; transform: translateY(-50%); color: #9aa7ad; font-size: 12px; text-align: center; pointer-events: none; }
    .slot-guide.ok { color: #50fa7b; }
    .slot-guide.warn { color: #ffe066; }
    .slot-guide.bad { color: #ff6b6b; }
    .status-led { position: absolute; right: 10px; top: 50%; transform: translateY(-50%); width: 16px; height: 16px; background: rgba(255,255,255,.25); border-radius: 50%; border: 2px solid #000; box-shadow: inset 0 0 8px rgba(255,255,255,.15); }
    #loginProgress { position: relative; z-index: 3; }
    .led-green { background: #50fa7b !important; box-shadow: 0 0 12px #50fa7b, inset 0 0 6px rgba(0,0,0,.35); }
    .led-yellow { background: #ffe066 !important; box-shadow: 0 0 12px #ffe066, inset 0 0 6px rgba(0,0,0,.35); }
    .led-red { background: #ff5555 !important; box-shadow: 0 0 12px #ff5555, inset 0 0 6px rgba(0,0,0,.35); }
    .id-card { width: 120px; height: 72px; background: #DDEEF0; border: 3px solid #000; border-radius: 8px; position: absolute; left: 20px; top: calc(100% - 100px); cursor: grab; user-select: none; padding: 6px; box-sizing: border-box; display: flex; align-items: center; gap: 8px; z-index: 1; }
    .id-card:active { cursor: grabbing; }
    .card-goose { width: 28px; height: 28px; background: var(--goose-color, #ffffff); border: 2px solid #000; border-radius: 4px; position: relative; overflow: hidden; }
    .card-goose svg { position: absolute; inset: 0; width: 100%; height: 100%; }
    .card-info { display: flex; flex-direction: column; justify-content: space-between; height: 100%; flex: 1; }
    .card-lines { width: 46px; height: 12px; border-top: 2px solid #000; align-self: flex-end; }
    .card-lvl { font-weight: 800; font-size: 12px; letter-spacing: .5px; color: #000; }
    .pickup-arrow { position: absolute; left: 40px; top: calc(100% - 118px); color: #fff; opacity: 0; pointer-events: none; animation: floatUp 1.2s ease-in-out infinite; }
    .id-card.unlocked + .pickup-arrow, .pickup-arrow.on { opacity: .8; }
    @keyframes floatUp { 0% { transform: translateY(2px); } 50% { transform: translateY(-4px); } 100% { transform: translateY(2px); } }
    .terminal.error { animation: shake .38s ease-in-out 1; }
    @keyframes shake { 0% { transform: translateX(0); } 20% { transform: translateX(-6px); } 40% { transform: translateX(6px); } 60% { transform: translateX(-4px); } 80% { transform: translateX(4px); } 100% { transform: translateX(0); } }

    /* Hidden legacy button scan effect removed in terminal mode */

    /* Notice board */
    .notice-board { position: fixed; right: 18px; top: 18px; transform: rotate(-2.5deg); z-index: 2; }
    .sticky { width: 200px; background: #fff8b8; color: #3a3a3a; border: 1px solid rgba(0,0,0,.05); box-shadow: 0 8px 18px rgba(0,0,0,.25); padding: 12px 14px; border-radius: 6px; transform-origin: top center; animation: swing 6s ease-in-out infinite; }
    .sticky h4 { font-size: 14px; margin-bottom: 6px; color: #2a2a2a; }
    .sticky p { font-size: 12px; line-height: 1.4; }
    @keyframes swing { 0% { transform: rotate(-2.5deg); } 50% { transform: rotate(2.5deg); } 100% { transform: rotate(-2.5deg); } }

    .cameo-pelican { position: absolute; bottom: 10%; left: -20%; width: 160px; height: 64px; border-radius: 40px; background: radial-gradient(circle at 30% 50%, #ffffff 0%, #eaeaea 60%, #c7c7c7 100%); box-shadow: 0 6px 20px rgba(0,0,0,.35); }

    .swipe-task { margin-top: 6px; }
    .swipe-track { position: relative; height: 44px; border-radius: 12px; background: rgba(255,255,255,0.06); border: 1px solid rgba(255,255,255,0.08); overflow: hidden; }
    .swipe-progress { position: absolute; left: 0; top: 0; bottom: 0; width: 0%; background: linear-gradient(90deg, rgba(0,166,255,0.22), rgba(195,105,255,0.22)); pointer-events: none; }
    .swipe-label { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; color: rgba(255,255,255,0.78); font-size: 13px; letter-spacing: .5px; pointer-events: none; }
    .swipe-thumb { position: absolute; top: 0; left: 0; width: 44px; height: 44px; border-radius: 12px; background: linear-gradient(90deg, #00a6ff, #c369ff, #ff4590); box-shadow: 0 6px 16px rgba(0,0,0,0.3); display: flex; align-items: center; justify-content: center; color: #fff; font-weight: 700; user-select: none; touch-action: none; cursor: grab; }

    /* Holographic security sheen on the ID card */
    .idcard { position: relative; }
    .idcard::after { content: ""; position: absolute; right: 12px; top: 12px; width: 96px; height: 24px; border-radius: 6px; background: linear-gradient(135deg, rgba(255,255,255,0.1), rgba(255,255,255,0.35), rgba(255,255,255,0.1)); background-size: 200% 100%; animation: holo 2.8s linear infinite; mix-blend-mode: screen; opacity: .6; pointer-events: none; }
    @keyframes holo { 0% { background-position: 200% 0; } 100% { background-position: -200% 0; } }

    /* ID Card header */
    .idcard-header { display: flex; align-items: center; justify-content: space-between; padding-bottom: 8px; border-bottom: 1px dashed rgba(255,255,255,0.12); margin-bottom: 6px; }
    .id-title { font-weight: 700; letter-spacing: .6px; font-size: 14px; color: rgba(255,255,255,0.9); }
    .chip { width: 42px; height: 28px; border-radius: 6px; background: linear-gradient(135deg,#e1e1e1,#b9b9b9); box-shadow: inset 0 0 0 2px rgba(0,0,0,0.08), inset 0 0 0 1px rgba(255,255,255,0.25); }

    /* Social entry */
    .social { position: fixed; left: 18px; bottom: 18px; z-index: 2; display: flex; gap: 8px; align-items: center; }
    .social a { display: inline-flex; align-items: center; justify-content: center; width: 36px; height: 36px; border-radius: 10px; background: rgba(255,255,255,0.08); color: #fff; text-decoration: none; border: 1px solid rgba(255,255,255,0.08); box-shadow: 0 4px 14px rgba(0,0,0,0.25); }
    .social a:hover { background: rgba(255,255,255,0.14); }

    /* Reduce motion */
    @media (prefers-reduced-motion: reduce) {
      * { animation: none !important; transition: none !important; }
    }
  </style>
</head>
<body>
  <div id="parallax">
    <canvas id="stars"></canvas>
    <div class="floaters">
      <div class="floater banana"></div>
      <div class="floater pizza"></div>
      <div class="floater helmet"></div>
    </div>
    <div id="cameo"></div>
  </div>
  <div class="terminal" id="terminal">
    <div class="title">🦆 木泗鹅鸭杀查询器</div>
    <div class="screen">
      <h3 class="lcd-hint">登录验证终端</h3>
      <input id="email" class="lcd-input" type="text" placeholder="用户名" />
      <input id="password" class="lcd-input" type="password" placeholder="密码" />
      <div id="msg" role="status" aria-live="polite"></div>
    </div>
    
    <div class="reader-slot locked" id="slot">
      <div class="slot-guide" id="slotGuide">滑过右侧即可登录</div>
      <div class="status-led" id="led"></div>
    </div>
    <div class="swipe-task" id="loginProgress">
      <div class="swipe-track">
        <div class="swipe-progress" id="loginProgressBar" style="width:0%"></div>
        <div class="swipe-label" id="loginProgressLabel"></div>
      </div>
    </div>
    <div class="id-card" id="scanCard">
      <div class="card-goose" title="鹅">
        <svg viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg">
          <path d="M44 26c0 6-7 10-14 10s-14-4-14-10 7-12 14-12 14 6 14 12z" fill="none" stroke="#000" stroke-width="3" />
          <circle cx="40" cy="20" r="5" fill="var(--goose-color, #ffffff)" stroke="#000" stroke-width="3" />
          <circle cx="42" cy="20" r="2" fill="#000" />
          <path d="M46 22 l10 -3 l-10 -3 z" fill="#f2a900" stroke="#000" stroke-width="2" />
        </svg>
      </div>
      <div class="card-info">
        <div class="card-lines"></div>
        <div class="card-lvl">等级 3</div>
      </div>
    </div>
  </div>

  <div class="notice-board">
    <div class="sticky">
      <h4>公告板</h4>
      <p>新功能：对局记录支持角色图标。</p>
      <p>服务器状态：正常</p>
    </div>
  </div>



  <script>
    let SESSION_ID = null
    const msg = document.getElementById('msg')
    const emailEl = document.getElementById('email')
    const pwdEl = document.getElementById('password')
    const terminalEl = document.getElementById('terminal')
    const slotEl = document.getElementById('slot')
    const ledEl = document.getElementById('led')
    const scanCard = document.getElementById('scanCard')
    const pickupArrow = document.getElementById('pickupArrow')
    const slotGuide = document.getElementById('slotGuide')
    const progWrap = document.getElementById('loginProgress')
    const progressBar = document.getElementById('loginProgressBar')
    const progressLabel = document.getElementById('loginProgressLabel')
    const reduceMotion = (window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches) || false
    let LOGGING = false
    let UNLOCKED = false
    let TRIGGERED = false
    let PROG_TIMER = null
    let MSG_TIMER = null

    function showError(text, hold){
      if(MSG_TIMER){ clearTimeout(MSG_TIMER); MSG_TIMER = null }
      msg.textContent = String(text||'')
      const ms = (typeof hold === 'number' && hold > 0) ? hold : 5000
      MSG_TIMER = setTimeout(()=>{ msg.textContent = ''; MSG_TIMER = null }, ms)
    }

    function setProgress(pct, label){
      const v = Math.max(0, Math.min(100, Number(pct)||0))
      if(progressBar){ progressBar.style.width = v + '%' }
      if(progressLabel && typeof label === 'string'){ progressLabel.textContent = label }
    }
    function startProgress(){
      setProgress(6, '正在登录...')
      if(PROG_TIMER){ clearInterval(PROG_TIMER); PROG_TIMER=null }
      let cur = 6
      PROG_TIMER = setInterval(()=>{
        cur += Math.random()*4 + 1
        if(cur > 60) cur = 60
        setProgress(cur)
      }, 300)
    }
    function finishProgress(){ if(PROG_TIMER){ clearInterval(PROG_TIMER); PROG_TIMER=null } setProgress(100, '完成') }
    function failProgress(){ if(PROG_TIMER){ clearInterval(PROG_TIMER); PROG_TIMER=null } setProgress(0, '') }

    const SFX = (()=>{
      let ctx
      function ensure(){ if(!ctx){ try{ ctx = new (window.AudioContext||window.webkitAudioContext)() }catch(e){} } }
      function tone(freq, dur, type='sine', gain=.08){ if(!ctx) return; const o=ctx.createOscillator(); const g=ctx.createGain(); o.type=type; o.frequency.value=freq; g.gain.value=gain; o.connect(g); g.connect(ctx.destination); o.start(); o.stop(ctx.currentTime+dur) }
      return {
        click(){ ensure(); tone(880, .05, 'square', .05) },
        scan(){ ensure(); tone(660,.08,'sawtooth',.04); setTimeout(()=>tone(880,.08,'sawtooth',.04),100); },
        success(){ ensure(); tone(523,.08,'sine',.06); setTimeout(()=>tone(659,.10,'sine',.06),120); setTimeout(()=>tone(784,.16,'sine',.06),240); },
        error(){ ensure(); tone(220,.18,'triangle',.06); }
      }
    })()

    function preloadStars(){
      const c = document.getElementById('stars')
      if(!c) return
      const dpr = Math.max(1, window.devicePixelRatio||1)
      const ctx = c.getContext('2d')
      let W=0,H=0, stars=[]
      function resize(){ W = c.clientWidth; H = c.clientHeight; c.width = W*dpr; c.height = H*dpr; ctx.setTransform(dpr,0,0,dpr,0,0); stars = Array.from({length: 400}, _=>({ x: Math.random()*W, y: Math.random()*H, r: Math.random()*1.2+0.2, a: Math.random()*0.6+0.2, s: Math.random()*0.2+0.02 })) }
      function draw(){ ctx.clearRect(0,0,W,H); ctx.fillStyle = '#ffffff'; for(const st of stars){ const tw = (Math.sin(perf*st.s+st.x*0.01)+1)/2; ctx.globalAlpha = st.a*0.6 + tw*0.4; ctx.beginPath(); ctx.arc(st.x, st.y, st.r, 0, Math.PI*2); ctx.fill() } ctx.globalAlpha = 1 }
      let perf = 0
      function tick(t){ perf = (t||0)/1000; draw(); req = requestAnimationFrame(tick) }
      let req
      resize(); window.addEventListener('resize', resize); req = requestAnimationFrame(tick)
    }

    function scheduleCameo(){
      const host = document.getElementById('cameo')
      if(!host) return
      function playRun(){ const wrap = document.createElement('div'); wrap.className = 'cameo-run move-across'; const g = document.createElement('div'); g.className='cameo-goose'; const d = document.createElement('div'); d.className='cameo-duck'; wrap.appendChild(g); wrap.appendChild(d); host.appendChild(wrap); setTimeout(()=>{ host.removeChild(wrap) }, 6500) }
      function playPelican(){ const p = document.createElement('div'); p.className = 'cameo-pelican move-across'; p.style.animationDuration = '10s'; host.appendChild(p); setTimeout(()=>{ host.removeChild(p) }, 10500) }
      async function play(){
        if(window.lottie && lottie.loadAnimation){ playRun() } else { (Math.random() < 0.5) ? playRun() : playPelican() }
        const next = Math.floor(15000 + Math.random()*15000)
        setTimeout(play, next)
      }
      const first = Math.floor(3000 + Math.random()*4000)
      setTimeout(play, first)
    }

    function updateLock(){
      const hasUser = emailEl.value.trim().length > 0
      const hasPass = pwdEl.value.trim().length > 0
      UNLOCKED = hasUser && hasPass
      slotEl.classList.toggle('locked', !UNLOCKED)
      scanCard.classList.toggle('unlocked', UNLOCKED)
      if(pickupArrow){ if(UNLOCKED){ pickupArrow.classList.add('on') } else { pickupArrow.classList.remove('on') } }
      TRIGGERED = false
      if(slotGuide){ slotGuide.textContent = '滑过右侧即可登录'; slotGuide.className = 'slot-guide' }
    }

    function bindCardDrag(){
      let dragging = false, shiftX = 0, shiftY = 0
      const container = document.getElementById('terminal')
      function setLED(state){ ledEl.classList.remove('led-green','led-red','led-yellow'); if(state) ledEl.classList.add(state) }
      function onDown(e){
        if(!UNLOCKED){ showError('请先填写用户名和密码', 5000); setLED('led-red'); SFX.error(); return }
        dragging = true; scanCard.style.transition = 'none'; TRIGGERED = false;
        const rect = scanCard.getBoundingClientRect();
        shiftX = e.clientX - rect.left; shiftY = e.clientY - rect.top;
        if(scanCard.setPointerCapture && e.pointerId!=null){ scanCard.setPointerCapture(e.pointerId) }
        SFX.click()
      }
      function onMove(e){
        if(!dragging) return;
        const cr = container.getBoundingClientRect();
        let x = e.clientX - shiftX - cr.left; let y = e.clientY - shiftY - cr.top;
        scanCard.style.left = x + 'px'; scanCard.style.top = y + 'px';
        const slotR = slotEl.getBoundingClientRect(); const cardR = scanCard.getBoundingClientRect();
        const overlap = Math.min(cardR.bottom, slotR.bottom) - Math.max(cardR.top, slotR.top)
        const vOverlap = overlap > 0 ? overlap : 0
        const vOk = vOverlap > (cardR.height * 0.5)
        if(vOk){
          slotEl.classList.add('scanning'); setLED('led-yellow');
          if(slotGuide){ slotGuide.textContent = '继续向右滑动'; slotGuide.className = 'slot-guide warn' }
          const centerX = cardR.left + cardR.width/2
          if(!TRIGGERED && centerX > slotR.right){
            TRIGGERED = true
            slotEl.classList.remove('scanning')
            setLED('led-yellow'); if(slotGuide){ slotGuide.textContent='正在验证中......'; slotGuide.className='slot-guide warn' }
            SFX.scan(); doLogin()
          }
        } else {
          slotEl.classList.remove('scanning'); setLED(null);
          if(slotGuide){ slotGuide.textContent = '滑过右侧即可登录'; slotGuide.className = 'slot-guide' }
        }
      }
      function finish(){
        if(!dragging) return; dragging = false;
        const slotR = slotEl.getBoundingClientRect(); const cardR = scanCard.getBoundingClientRect();
        const overlap = Math.min(cardR.bottom, slotR.bottom) - Math.max(cardR.top, slotR.top)
        const vOverlap = overlap > 0 ? overlap : 0
        const vOk = vOverlap > (cardR.height * 0.5)
        const centerX = cardR.left + cardR.width/2
        const success = vOk && (centerX > slotR.right)
        slotEl.classList.remove('scanning')
        if(success){
          setLED('led-yellow'); if(slotGuide){ slotGuide.textContent='正在验证中......'; slotGuide.className='slot-guide warn' }
          SFX.scan(); doLogin()
        } else {
          if(slotGuide){ slotGuide.textContent = '滑过右侧即可登录'; slotGuide.className = 'slot-guide' }
          reset()
        }
      }
      function reset(){ scanCard.style.transition = 'all .35s'; scanCard.style.left = '20px'; scanCard.style.top = 'calc(100% - 100px)'; setTimeout(()=>{ scanCard.style.transition = '' }, 360) }
      scanCard.addEventListener('pointerdown', onDown)
      window.addEventListener('pointermove', onMove)
      window.addEventListener('pointerup', finish)
    }

    

    function flashError(){ terminalEl.classList.add('error'); setTimeout(()=>terminalEl.classList.remove('error'), 700) }

    async function preload(){
      try{
        const r = await fetch('../api/preload', { method: 'POST' })
        if(!r.ok){ throw new Error('预加载失败: ' + r.status) }
        const data = await r.json()
        SESSION_ID = data.session_id
      }catch(e){
        showError('连接失败：' + e.message, 5000)
      }
    }

    async function doLogin(){
      if(LOGGING) return
      const email = emailEl.value.trim()
      const password = pwdEl.value.trim()
      if(!email || !password){ showError('请输入用户名和密码', 5000); SFX.error(); flashError(); return }
      SFX.scan(); startProgress()
      LOGGING = true
      try{
        const doRequest = async () => {
          const payload = { email, password }
          if(SESSION_ID){ payload.session_id = SESSION_ID }
          return fetch('../api/login', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(payload) })
        }
        const parseDetail = async (resp) => {
          try {
            const txt = await resp.text()
            try { const j = JSON.parse(txt); return (j && j.detail) ? j.detail : txt } catch(_) { return txt }
          } catch(e){ return '请求失败' }
        }
        let r = await doRequest()
        if(!r.ok){
          const detail = await parseDetail(r)
          const needRetry = (r.status === 404) && (detail.includes('无效的会话') || detail.includes('已过期'))
          if(needRetry){
            if(progressLabel){ progressLabel.textContent = '重新连接中...' }
            SESSION_ID = null
            r = await doRequest()
          } else {
            throw new Error(detail || ('HTTP ' + r.status))
          }
        }
        if(!r.ok){ const detail2 = await parseDetail(r); throw new Error(detail2 || ('HTTP ' + r.status)) }
        const data = await r.json()
        if(!data.ok){ throw new Error('登录失败') }
        if(data.session_id){ SESSION_ID = data.session_id }
        SFX.success(); finishProgress()
        window.location.href = 'records.html?session=' + encodeURIComponent(SESSION_ID)
      }catch(e){
        if(slotGuide){ slotGuide.textContent = '登录失败：' + e.message; slotGuide.className = 'slot-guide bad' }
        try{ ledEl.classList.remove('led-green','led-yellow','led-red'); ledEl.classList.add('led-red') }catch(_){}
        try{ slotEl.classList.remove('scanning') }catch(_){}
        SFX.error(); flashError(); failProgress()
      } finally {
        LOGGING = false
      }
    }

    document.addEventListener('DOMContentLoaded', ()=>{
      if(!reduceMotion){
        preloadStars()
        scheduleCameo()
      }
      bindCardDrag()
      emailEl.addEventListener('input', updateLock)
      pwdEl.addEventListener('input', updateLock)
      updateLock()
    })
    emailEl.addEventListener('keydown', (e)=>{ if(e.key === 'Enter'){ doLogin() } })
    pwdEl.addEventListener('keydown', (e)=>{ if(e.key === 'Enter'){ doLogin() } })
  </script>
</body>
</html>
